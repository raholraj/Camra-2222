name: Build Camera App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # मैन्युअली रन करने के लिए

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Unzip Uploaded File
      run: unzip "googel cmara app.zip" -d source_code

    - name: Build Debug APK
      run: |
        # gradlew फाइल का सही पाथ ढूँढना
        PROJECT_ROOT=$(find source_code -name "gradlew" -printf '%h\n' -quit)
        cd "$PROJECT_ROOT"
        
        # परमिशन देना और बिल्ड करना
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Camera-App-Debug-APK
        path: source_code/**/app/build/outputs/apk/debug/*.apk
