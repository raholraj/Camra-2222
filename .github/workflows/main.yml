name: Build Camera App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Unzip Uploaded File
      run: unzip "googel cmara app.zip" -d source_code

    - name: Fix ConcurrentCameraMode.kt (missing enum bug)
      # ConcurrentCameraMode.kt file mein ConcurrentCameraMode enum ki jagah
      # galti se DualCameraRecordingMode/DualCameraState likha hua hai.
      run: |
        MODEL_DIR=$(find source_code -type d -path "*core/model/src/main/java/com/google/jetpackcamera/model" -print -quit)

        if [ -z "$MODEL_DIR" ]; then
          echo "ERROR: core/model package directory nahi mili, path check karo."
          exit 1
        fi

        echo "Model dir mila: $MODEL_DIR"

        cat > "$MODEL_DIR/ConcurrentCameraMode.kt" << 'EOF'
        package com.google.jetpackcamera.model

        enum class ConcurrentCameraMode {
            OFF,
            DUAL
        }
        EOF

        cat > "$MODEL_DIR/DualCameraMode.kt" << 'EOF'
        package com.google.jetpackcamera.model

        enum class DualCameraRecordingMode {
            SINGLE,
            PICTURE_IN_PICTURE,
            SIDE_BY_SIDE,
            SEPARATE_FILES
        }

        data class DualCameraState(
            val mode: DualCameraRecordingMode = DualCameraRecordingMode.SINGLE,
            val isSecondaryCameraActive: Boolean = false
        )
        EOF

        echo "--- Patched files ---"
        cat "$MODEL_DIR/ConcurrentCameraMode.kt"
        echo "---"
        cat "$MODEL_DIR/DualCameraMode.kt"

    - name: Fix DualRecordingMode / runConcurrentCameraSession (missing symbols)
      # 3 bugs mile is baar:
      # 1) CameraSystem.kt line 50 par type "DualRecordingMode" likha hai
      #    jabki asli class ka naam "DualCameraRecordingMode" hai (typo).
      # 2) CameraXCameraSystem class us interface method
      #    "setDualRecordingMode" ko override hi nahi karti -> "class is
      #    not abstract and does not implement abstract member" error.
      # 3) CameraXCameraSystem.kt "runConcurrentCameraSession(...)" call
      #    karta hai lekin ye function CameraSession.kt mein exist hi
      #    nahi karta -> "Unresolved reference" error.
      run: |
        CAMERA_DIR=$(find source_code -type d -path "*core/camera/src/main/java/com/google/jetpackcamera/core/camera" -print -quit)

        if [ -z "$CAMERA_DIR" ]; then
          echo "ERROR: core/camera package directory nahi mili."
          exit 1
        fi

        echo "Camera dir mila: $CAMERA_DIR"

        SYSTEM_FILE="$CAMERA_DIR/CameraSystem.kt"
        IMPL_FILE="$CAMERA_DIR/CameraXCameraSystem.kt"
        SESSION_FILE="$CAMERA_DIR/CameraSession.kt"

        # 1) Typo fix: sirf type ka naam badlo, method ka naam mat chhedo
        sed -i 's/mode: DualRecordingMode/mode: DualCameraRecordingMode/' "$SYSTEM_FILE"

        for f in "$SYSTEM_FILE" "$IMPL_FILE"; do
          if ! grep -q "import com.google.jetpackcamera.model.DualCameraRecordingMode" "$f"; then
            sed -i '0,/^import com\.google\.jetpackcamera\.model\./s//import com.google.jetpackcamera.model.DualCameraRecordingMode\n&/' "$f"
          fi
        done

        # 2) missing override + 3) missing function ko Python se reliably patch karo
        python3 - "$IMPL_FILE" "$SESSION_FILE" << 'PYEOF'
        import sys

        impl_path, session_path = sys.argv[1], sys.argv[2]

        # --- 2) CameraXCameraSystem mein missing override add karo ---
        with open(impl_path, "r") as f:
            impl_src = f.read()

        if "override suspend fun setDualRecordingMode" not in impl_src:
            override_block = (
                "    override suspend fun setDualRecordingMode(mode: DualCameraRecordingMode) {\n"
                "        // TODO: Dual-camera recording mode ki asli logic yahan\n"
                "        //  implement karni hai. Abhi sirf build unblock karne\n"
                "        //  ke liye stub hai.\n"
                "        Log.w(TAG, \"setDualRecordingMode: not yet implemented, mode=$mode\")\n"
                "    }\n\n"
            )
            impl_src = impl_src.replace(
                "    companion object {",
                override_block + "    companion object {",
                1
            )
            with open(impl_path, "w") as f:
                f.write(impl_src)
            print("setDualRecordingMode override added to CameraXCameraSystem.kt")
        else:
            print("setDualRecordingMode override already present, skipping.")

        # --- 3) CameraSession.kt mein missing runConcurrentCameraSession add karo ---
        with open(session_path, "r") as f:
            session_src = f.read()

        if "fun runConcurrentCameraSession" not in session_src:
            new_function = (
                "\n\n"
                "context(CameraSessionContext)\n"
                "internal suspend fun runConcurrentCameraSession(\n"
                "    sessionSettings: PerpetualSessionSettings.ConcurrentCamera,\n"
                "    cameraConstraints: CameraConstraints?\n"
                "): Unit = coroutineScope {\n"
                "    // TODO: Concurrent/dual camera session ki asli binding logic\n"
                "    //  yahan implement karni hai (ConcurrentCameraSession class\n"
                "    //  ka bindDualCameras jaisa). Abhi ke liye ye stub sirf\n"
                "    //  build ko unblock karta hai.\n"
                "    Log.w(\n"
                "        \"CameraSession\",\n"
                "        \"runConcurrentCameraSession: not yet implemented for \" +\n"
                "            sessionSettings.primaryCameraInfo\n"
                "    )\n"
                "    kotlinx.coroutines.awaitCancellation()\n"
                "}\n"
            )
            with open(session_path, "a") as f:
                f.write(new_function)
            print("runConcurrentCameraSession stub added to CameraSession.kt")
        else:
            print("runConcurrentCameraSession already present, skipping.")
        PYEOF

        echo "--- CameraSystem.kt (patched line) ---"
        grep -n "setDualRecordingMode\|DualCameraRecordingMode" "$SYSTEM_FILE"
        echo "--- CameraXCameraSystem.kt (added override) ---"
        grep -n "setDualRecordingMode" "$IMPL_FILE"
        echo "--- CameraSession.kt (added function, last 20 lines) ---"
        tail -20 "$SESSION_FILE"

    - name: Fix PreviewScreen.kt (broken snippet) + FakeCameraSystem.kt (missing override)
      run: |
        PREVIEW_FILE=$(find source_code -type f -path "*feature/preview/src/main/java/com/google/jetpackcamera/feature/preview/PreviewScreen.kt" -print -quit)
        FAKE_FILE=$(find source_code -type f -path "*core/camera/testing/src/main/java/com/google/jetpackcamera/core/camera/testing/FakeCameraSystem.kt" -print -quit)

        if [ -z "$PREVIEW_FILE" ] || [ -z "$FAKE_FILE" ]; then
          echo "ERROR: PreviewScreen.kt ya FakeCameraSystem.kt nahi mili."
          exit 1
        fi

        echo "PreviewScreen.kt: $PREVIEW_FILE"
        echo "FakeCameraSystem.kt: $FAKE_FILE"

        # 1) PreviewScreen.kt ko poora valid, compiling placeholder se replace karo
        cat > "$PREVIEW_FILE" << 'EOF'
        package com.google.jetpackcamera.feature.preview

        import androidx.compose.foundation.layout.Box
        import androidx.compose.foundation.layout.fillMaxSize
        import androidx.compose.material3.Text
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import com.google.jetpackcamera.model.CaptureEvent

        @Composable
        fun PreviewScreen(
            onNavigateToSettings: () -> Unit,
            onNavigateToPostCapture: () -> Unit,
            onRequestWindowColorMode: (Int) -> Unit,
            onFirstFrameCaptureCompleted: () -> Unit,
            onCaptureEvent: (CaptureEvent) -> Unit
        ) {
            Box(
                modifier = Modifier.fillMaxSize(),
                contentAlignment = Alignment.Center
            ) {
                Text("Camera preview abhi implement nahi hua (placeholder)")
            }
        }
        EOF

        # 2) FakeCameraSystem.kt mein missing override add karo
        python3 - "$FAKE_FILE" << 'PYEOF'
        import sys

        fake_path = sys.argv[1]

        with open(fake_path, "r") as f:
            src = f.read()

        if "import com.google.jetpackcamera.model.DualCameraRecordingMode" not in src:
            src = src.replace(
                "package com.google.jetpackcamera.core.camera.testing",
                "package com.google.jetpackcamera.core.camera.testing\n\n"
                "import com.google.jetpackcamera.model.DualCameraRecordingMode",
                1
            )

        if "override suspend fun setDualRecordingMode" not in src:
            override_block = (
                "\n    override suspend fun setDualRecordingMode(mode: DualCameraRecordingMode) {\n"
                "        // Test double: state track karne ki zaroorat nahi, no-op.\n"
                "    }\n"
            )
            # Class ke aakhri closing brace se pehle insert karo
            idx = src.rfind("}")
            src = src[:idx] + override_block + src[idx:]

        with open(fake_path, "w") as f:
            f.write(src)

        print("FakeCameraSystem.kt patched.")
        PYEOF

        echo "--- PreviewScreen.kt (new content) ---"
        cat "$PREVIEW_FILE"
        echo "--- FakeCameraSystem.kt (added override) ---"
        grep -n "setDualRecordingMode\|DualCameraRecordingMode" "$FAKE_FILE"

    - name: Build Debug APK
      # --continue flag saare errors ko ek sath log karega
      run: |
        PROJECT_ROOT=$(find source_code -name "gradlew" -printf '%h\n' -quit)
        cd "$PROJECT_ROOT"
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --continue

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always() # Build fail hone par bhi artifact upload karne ka try karega
      with:
        name: Camera-App-Debug-APK
        path: source_code/**/app/build/outputs/apk/**/*.apk
